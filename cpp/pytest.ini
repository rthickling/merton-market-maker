[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q
markers =
    smoke: basic module import and initialization checks
    params: online parameter update and calibration checks
    pricing: no-jump conditional mean and QuantLib helper checks
    reflection: reflected property and method binding checks
    agreement: C++ module and pure-Python reference agree on the same input
    numba: Numba-compiled variant and pure-Python reference agree on the same input
    equivalence: hand-written nanobind module matches the reflected module
    cppyy: cppyy calls the same compiled core as the nanobind modules and agrees exactly
